<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>统一认证中心 · 登录</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center;
    justify-content: center; background: #f4f6fa;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .card {
    width: 360px; background: #fff; border-radius: 14px; padding: 36px 32px;
    box-shadow: 0 10px 40px rgba(20, 30, 60, .12);
  }
  h1 { margin: 0 0 6px; font-size: 20px; color: #1a2233; }
  .sub { margin: 0 0 22px; font-size: 13px; color: #8a93a6; }
  label { display: block; margin-bottom: 14px; font-size: 13px; color: #414a5e; }
  input[type=text], input[type=password] {
    width: 100%; margin-top: 6px; padding: 10px 12px; font-size: 14px;
    border: 1px solid #d6dbe6; border-radius: 8px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus { border-color: #3b6ef5; box-shadow: 0 0 0 3px rgba(59,110,245,.15); }
  button {
    width: 100%; margin-top: 6px; padding: 11px; font-size: 15px; font-weight: 600;
    color: #fff; background: #3b6ef5; border: 0; border-radius: 8px; cursor: pointer;
  }
  button:hover { background: #2f5ee0; }
  .error {
    margin-bottom: 16px; padding: 10px 12px; font-size: 13px;
    color: #b3261e; background: #fdecea; border-radius: 8px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>统一认证中心</h1>
    <p class="sub">一次登录，访问全部业务系统</p>
    {{ERROR_BLOCK}}
    <form method="post" action="/login" autocomplete="on">
      <input type="hidden" name="redirect" value="{{REDIRECT}}">
      <label>用户名
        <input type="text" name="username" autocomplete="username" required autofocus>
      </label>
      <label>密码
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit">登 录</button>
    </form>
  </div>
</body>
</html>
