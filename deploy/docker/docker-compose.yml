# uac 认证中心 生产部署 (docker compose)
# 用法:
#   cp .env.example .env           # 设置 JWT_SECRET
#   docker compose up -d --build   # 构建并启动(开机自启 + 崩溃自动重启)
# 附加数据库/Redis(生产):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# 说明: 测试环境不用 docker 与数据库, 直接本机运行二进制即可(见 docs/TESTING.md)。

services:
  auth-center:
    build:
      context: ../..                      # 项目根目录(uac/)
      dockerfile: deploy/docker/Dockerfile
    image: uac/auth-center:1.0.0
    container_name: uac-auth-center
    restart: unless-stopped               # 开机自启 + 崩溃自动重启
    environment:
      UAC_HOST: "0.0.0.0"                 # 容器内监听全部网卡, 端口不对宿主机发布
      UAC_PORT: "27149"
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET (openssl rand -hex 32)}
      UAC_CONFIG: /opt/auth-center/config.json
    # 调试时可临时对宿主机回环开放(生产保持注释):
    # ports:
    #   - "127.0.0.1:27149:27149"
    networks: [uac-net]
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:stable-alpine
    container_name: uac-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"                        # 启用 TLS 时放开
    volumes:
      - ./nginx-auth-center.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-center
    networks: [uac-net]

networks:
  uac-net:
