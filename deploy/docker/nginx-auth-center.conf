# uac 认证中心 Nginx 配置(docker compose 场景)
# 挂载为 /etc/nginx/conf.d/default.conf; 上游指向 compose 网络内的服务名。

upstream auth_center_backend {
    server auth-center:27149;   # docker 网络内服务名
    keepalive 32;               # 连接池
}

server {
    listen 80;
    server_name auth.your-domain.com;

    # ---- 安全响应头 ----
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # 仅 HTTPS 时启用 HSTS:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    client_max_body_size 1m;

    location / {
        proxy_pass http://auth_center_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
