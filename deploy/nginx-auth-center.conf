# uac 认证中心 Nginx 反向代理配置(宿主机/无 docker 场景)
# 安装: cp nginx-auth-center.conf /etc/nginx/sites-available/auth-center
#       ln -s /etc/nginx/sites-available/auth-center /etc/nginx/sites-enabled/
#       nginx -t && systemctl reload nginx
# 生产环境务必启用 TLS(见 docs/DEPLOYMENT.md 第 3.5 节, 使用 certbot)。

upstream auth_center_backend {
    server 127.0.0.1:27149;
    keepalive 32;              # 连接池, 提升性能
}

# HTTP -> HTTPS 跳转(生产启用 TLS 时使用; 测试环境可注释本段)
server {
    listen 80;
    server_name auth.your-domain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;    # ACME 验证
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # listen 443 ssl http2;   # 生产: 启用 TLS
    listen 80;                 # 测试环境(无证书)直接 80
    server_name auth.your-domain.com;

    # ssl_certificate     /etc/letsencrypt/live/auth.your-domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/auth.your-domain.com/privkey.pem;

    # ---- 安全响应头 ----
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # 仅 HTTPS 时启用 HSTS:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 日志
    access_log /var/log/nginx/auth-center.access.log;
    error_log  /var/log/nginx/auth-center.error.log warn;

    client_max_body_size 1m;

    location / {
        proxy_pass http://auth_center_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";                 # 配合 keepalive 连接池
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
